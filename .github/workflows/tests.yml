name: tests

on:
  push:
  pull_request:

jobs:
  protocol-tests:
    name: 协议与核心逻辑（${{ matrix.os }}）
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: 运行单元测试
        shell: bash
        run: |
          python -m unittest discover -s tests -v

  powershell-check:
    name: PowerShell 语法与编码检查
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: 检查 .ps1 语法
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem -Filter *.ps1 | ForEach-Object {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $failed = $true
              Write-Host "::error file=$($_.Name)::$($errors -join '; ')"
            } else {
              Write-Host "OK: $($_.Name)"
            }
          }
          if ($failed) { exit 1 }

  node-reference:
    name: JS 参考向量一致性
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: 重新生成向量并与仓库文件比较
        run: |
          node tests/js_reference.js > /tmp/expected.json
          diff -u tests/js_reference_expected.json /tmp/expected.json
